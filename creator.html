  try{ const t=localStorage.getItem(KEY); if(t){ had=true; const o=JSON.parse(t); S=Object.assign(defaults(),o); S.level=3; if(S.method==='pointbuy') S.method='standard'; if(!Array.isArray(S.hpRolls)) S.hpRolls=[null,null]; S.std=Object.assign(defaults().std,o.std||{}); S.pb=Object.assign(defaults().pb,o.pb||{}); S.man=Object.assign(defaults().man,o.man||{}); } }catch(e){}
  if(!had) loadPreset();
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- effective race ---------- */
function effRace(){
  const b=DATA.races[S.race]; if(!b) return null;
  const sub = b.subraces ? b.subraces[S.subrace] : null;
  const R = {key:S.race, name:b.name+(sub?" ("+sub.name+")":""), page:b.page+(sub?"; "+sub.page:""), size:b.size, speed:(sub&&sub.speed)||b.speed,
    fixed:Object.assign({},b.fixed||{},sub&&sub.fixed||{}), flex:(sub&&sub.flex)||b.flex||[], flexExclude:b.flexExclude||[],
    customOk:!!b.customOk&&!(sub&&sub.noCustom), langs:(b.langs||[]).slice(), langPicks:(b.langPicks||0)+(sub&&sub.langPicks||0),
    skillsFixed:(b.skillsFixed||[]).slice(), skillPicks:(sub&&sub.skillPicks)||b.skillPicks||0,
    toolPick:b.toolPick||null, toolsFixed:(sub&&sub.toolsFixed)||[], feat:!!((sub&&sub.feat)||b.feat),
    dragon:!!b.dragon, wizardCantrip:!!(sub&&sub.wizardCantrip), variableTrait:!!b.variableTrait,
    cantripsFixed:((b.cantripsFixed||[]).concat(sub&&sub.cantripsFixed||[])),
    hpPerLevel:(sub&&sub.hpPerLevel)||0, traits:(b.traits||[]).concat(sub&&sub.traits||[]), needSub:!!b.subraces, blurb:b.blurb};
  if(b.subraces && !sub){ R.fixed={}; R.flex=[]; }
  return R;
}
function asiSlots(R){
  if(!R) return [];
  if(S.customize && R.customOk){
    const vals=Object.values(R.fixed).concat(R.flex).sort((a,b)=>b-a);
    return vals.map(v=>({v:v,exclude:[]}));
  }
  return R.flex.map(v=>({v:v,exclude:R.flexExclude}));
}
function asiPicks(R){ return (S.customize && R.customOk) ? S.custPick : S.flexPick; }

/* ---------- compute everything ---------- */
function compute(){
  let C=null;
  for(let pass=0;pass<4;pass++){ C=build(); if(!C.changed) break; }
  return C;
}
function build(){
  const L=S.level, C={slots:[],problems:[],changed:false,owned:{skills:new Set(),tools:new Set(),langs:new Set()},notes:[],featIds:[]};
  const R=effRace(), BG=DATA.backgrounds[S.bg]||null, SP=DATA.specialists[S.specialist]||null;
  C.R=R; C.BG=BG; C.SP=SP;
  const need=(step,msg)=>C.problems.push({step,msg});
  function slot(id,group,label,options,count,hint){
    const cur=S.sel[id];
    let arr=Array.isArray(cur)?cur:(cur?[cur]:[]);
    const ok=v=>options.some(o=>o.v===v&&!o.dis);
    const valid=arr.filter((v,i)=>ok(v)&&arr.indexOf(v)===i).slice(0,count);
    if(valid.length!==arr.length){ C.changed=true; S.sel[id]=count>1?valid:(valid[0]||""); }
    const s={id,group,label,options,count,hint,value:valid};
    C.slots.push(s); return valid;
  }
  const opts=(list,owned)=>list.map(x=>({v:x,l:x,dis:owned&&owned.has(x)}));
  const own=C.owned;

  /* languages */
  if(R){
    R.langs.forEach((lg,i)=>{
      if(S.customize && R.customOk){
        const o=[{v:"",l:"Keep "+lg}].concat(DATA.languages.filter(x=>x!==lg).map(x=>({v:x,l:x,dis:own.langs.has(x)})));
        const v=slot("lang:swap:"+i,"race","Language: replace "+lg+"? (Tasha's, T p.7)",o,1,"");
        const f=v[0]||lg; own.langs.add(f);
      } else own.langs.add(lg);
    });
    if(R.langPicks){ const v=slot("lang:race","race","Extra language (race)",opts(DATA.languages,own.langs),R.langPicks,"Pick any language. Ask your DM about secret languages like Deep Speech (PHB p.123)."); v.forEach(x=>own.langs.add(x)); if(v.length<R.langPicks) need(1,"Choose your extra racial language."); }
  }
  if(BG&&BG.langs){ const v=slot("lang:bg","bg","Background languages",opts(DATA.languages,own.langs),BG.langs,""); v.forEach(x=>own.langs.add(x)); if(v.length<BG.langs) need(3,"Choose your background language(s)."); }

  /* skills */
  const allSk=DATA.skills.map(s=>s[0]);
  if(BG) BG.skills.forEach(s=>own.skills.add(s));
  if(BG&&BG.skillChoice){ const v=slot("skill:bgchoice","bg","Background skill (one that fits your faction)",opts(BG.skillChoice,own.skills),1,""); if(v[0]) own.skills.add(v[0]); else need(3,"Choose your Faction Agent skill."); }
  if(R){
    R.skillsFixed.forEach(sk=>{
      if(S.customize && R.customOk){
        const o=[{v:"",l:"Keep "+sk}].concat(allSk.filter(x=>x!==sk).map(x=>({v:x,l:x,dis:own.skills.has(x)})));
        const v=slot("skill:swap:"+sk,"race","Skill: replace "+sk+"? (Tasha's proficiency swap, T p.7)",o,1,"");
        const f=v[0]||sk; if(own.skills.has(f)){ const d=slot("skill:dup:"+f,"skills","You already have "+f+" from your background. Choose a different skill (PHB p.125)",opts(allSk,own.skills),1,""); if(d[0]) own.skills.add(d[0]); else need(4,"Replace the duplicate skill "+f+"."); } else own.skills.add(f);
      } else if(own.skills.has(sk)){
        const d=slot("skill:dup:"+sk,"skills","You already have "+sk+" from your background. Choose a different skill (PHB p.125)",opts(allSk,own.skills),1,"");
        if(d[0]) own.skills.add(d[0]); else need(4,"Replace the duplicate skill "+sk+".");
      } else own.skills.add(sk);
    });
    let rp=R.skillPicks; if(R.variableTrait && S.customTrait==="skill") rp=1;
    if(R.variableTrait && !S.customTrait) need(1,"Custom Lineage: choose darkvision or a skill.");
    if(rp){ const v=slot("skill:race","race","Skill from your race",opts(allSk,own.skills),rp,""); v.forEach(x=>own.skills.add(x)); if(v.length<rp) need(1,"Choose your racial skill(s)."); }
  }
  const cs=slot("skill:class","skills","Artificer skills: choose "+DATA.cls.skillCount,DATA.cls.skillList.map(x=>({v:x,l:x,dis:own.skills.has(x)})),DATA.cls.skillCount,"");
  cs.forEach(x=>own.skills.add(x)); if(cs.length<DATA.cls.skillCount) need(4,"Choose "+DATA.cls.skillCount+" artificer skills.");

  /* tools */
  DATA.cls.fixedTools.forEach(t=>own.tools.add(t));
  const ct=slot("tool:class","skills","Artificer: one kind of artisan's tools",opts(DATA.artisanTools,own.tools),1,"");
  if(ct[0]) own.tools.add(ct[0]); else need(4,"Choose your artisan's tools.");
  const toolPool=()=>DATA.artisanTools.concat(DATA.gamingSets,DATA.instruments,DATA.otherTools);
  function fixedTool(t,id,group,step,why){
    if(own.tools.has(t)){ const d=slot(id,group,"You already have "+t+" ("+why+"). Choose a different tool (PHB p.125)",opts(toolPool(),own.tools),1,""); if(d[0]) own.tools.add(d[0]); else need(step,"Replace the duplicate tool "+t+"."); }
    else own.tools.add(t);
  }
  if(BG){
    (BG.toolsFixed||[]).forEach((t,i)=>fixedTool(t,"tool:bgdup:"+i,"bg",3,"background"));
    (BG.toolChoices||[]).forEach((tc,i)=>{
      const list=tc[1]==="gaming"?DATA.gamingSets:tc[1]==="instrument"?DATA.instruments:DATA.artisanTools;
      const v=slot("tool:bg:"+i,"bg","Background tool: "+tc[0],opts(list,own.tools),1,""); if(v[0]) own.tools.add(v[0]); else need(3,"Choose your background tool ("+tc[0]+").");
    });
  }
  if(R){
    (R.toolsFixed||[]).forEach((t,i)=>fixedTool(t,"tool:racedup:"+i,"skills",4,"race"));
    if(R.toolPick){ const v=slot("tool:race","race","Racial tool proficiency",opts(R.toolPick,own.tools),1,""); if(v[0]) own.tools.add(v[0]); else need(1,"Choose your racial tool."); }
  }

  /* feats */
  C.feat=null; C.featExtra={};
  if(R&&R.feat){
    const fo=Object.keys(DATA.feats).map(k=>({v:k,l:DATA.feats[k].n}));
    const v=slot("feat:race","race","Feat ("+DATA.featsPage+")",fo,1,"");
    if(v[0]){ C.feat=v[0]; const F=DATA.feats[v[0]];
      if(F.asiChoice){ const ao=F.asiChoice.map(a=>({v:a,l:AN(a)})); const av=slot("feat:asi","race",F.n+": which ability gets +1?",ao,1,""); C.featExtra.asi=av[0]; if(!av[0]) need(1,F.n+": choose the ability."); }
      if(F.skilled){ const so=allSk.map(x=>({v:"skill:"+x,l:x+" (skill)",dis:own.skills.has(x)})).concat(toolPool().map(x=>({v:"tool:"+x,l:x+" (tool)",dis:own.tools.has(x)})));
        const sv=slot("feat:skilled","skills","Skilled feat: choose 3 skills or tools",so,3,""); sv.forEach(x=>{ if(x.indexOf("skill:")===0) own.skills.add(x.slice(6)); else own.tools.add(x.slice(5)); }); C.featExtra.skilled=sv; if(sv.length<3) need(4,"Skilled feat: choose 3 skills or tools."); }
    } else need(1,"Choose a feat.");
  }

  /* specialist tool (level 3) */
  if(L>=3){
    if(!SP) need(7,"Choose your Artificer Specialist (needed at level 3).");
    else if(own.tools.has(SP.tool)){ const d=slot("tool:spec","spec","You already have "+SP.tool+". Choose another artisan's tool (T p.14-19)",opts(DATA.artisanTools,own.tools),1,""); if(d[0]) own.tools.add(d[0]); else need(7,"Choose a replacement artisan's tool."); }
    else own.tools.add(SP.tool);
  }

  /* ability scores */
  C.base={}; let abOk=true;
  ABIL.forEach(a=>{ let v=S.method==="standard"?S.std[a]:S.man[a]; if(v==null||v==="") {abOk=false; v=null;} C.base[a]=v; });
  if(S.method==="standard"){ const used=ABIL.map(a=>S.std[a]).filter(v=>v!=null); if(used.length<6) {abOk=false;} if(new Set(used).size!==used.length){abOk=false; need(2,"Each standard-array number can be used only once.");} }
  if(S.method==="manual"){ ABIL.forEach(a=>{ const v=S.man[a]; if(v!=null&&(v<DATA.manualMin||v>DATA.manualMax||!Number.isInteger(v))){abOk=false;need(2,"Rolled scores must be whole numbers from 6 to 18.");} }); }
  if(!abOk && !C.problems.some(p=>p.step===2)) need(2,"Fill in all six ability scores.");
  C.racial={str:0,dex:0,con:0,int:0,wis:0,cha:0};
  if(R){
    const sl=asiSlots(R), pk=asiPicks(R);
    if(S.customize && R.customOk){ /* all increases free */ }
    else Object.keys(R.fixed).forEach(a=>C.racial[a]+=R.fixed[a]);
    const used=new Set(S.customize&&R.customOk?[]:Object.keys(R.fixed));
    sl.forEach((s,i)=>{ const a=pk[i]; if(!a||s.exclude.includes(a)||used.has(a)){ need(1,"Place every racial ability increase on a different score."); return; } used.add(a); C.racial[a]+=s.v; });
  } else need(1,"Choose a race.");
  if(R&&R.needSub&&!S.subrace) need(1,"Choose a subrace.");
  if(R&&R.dragon&&!S.dragon) need(1,"Choose a draconic ancestry.");
  if(R&&R.key==="custom"&&!S.lineSize) need(1,"Choose a size.");
  C.featAsi={str:0,dex:0,con:0,int:0,wis:0,cha:0};
  if(C.feat){ const F=DATA.feats[C.feat]; if(F.asi) Object.keys(F.asi).forEach(a=>C.featAsi[a]+=F.asi[a]); if(F.asiChoice&&C.featExtra.asi) C.featAsi[C.featExtra.asi]+=1; }
  C.score={}; C.mod={};
  ABIL.forEach(a=>{ const b=C.base[a]==null?8:C.base[a]; C.score[a]=Math.min(20,b+C.racial[a]+C.featAsi[a]); C.mod[a]=mod(C.score[a]); });
  C.abOk=abOk;

  /* numbers */
  C.pb=DATA.cls.profBonus(L);
  C.intMod=C.mod.int;
  C.dc=8+C.pb+C.intMod; C.atk=C.pb+C.intMod;
  C.prepN=Math.max(1,C.intMod+Math.floor(L/2));
  C.cantripN=L>=14?4:L>=10?3:2;
  C.slotsArr=DATA.cls.slots[L]||[2];
  C.inf=DATA.cls.infusions(L);
  let hpPer=0; if(R) hpPer+=R.hpPerLevel; if(C.feat&&DATA.feats[C.feat].hpPerLevel) hpPer+=DATA.feats[C.feat].hpPerLevel;
  C.hp = Math.max(1,8+C.mod.con)+hpPer;
  for(let lv=2;lv<=L;lv++){ const r=S.hpMode==="roll"?S.hpRolls[lv-2]:5; C.hp+=Math.max(1,(r==null?0:r)+C.mod.con)+hpPer;
    if(S.hpMode==="roll"&&(r==null||r<DATA.hpRollMin||r>DATA.hpRollMax||!Number.isInteger(r))) need(2,"Hit points: enter a d8 roll (2 to 8, after rerolling 1s) for level "+lv+", or choose the fixed average."); }
  C.speed=R?R.speed:30;
  C.init=C.mod.dex+((C.feat&&DATA.feats[C.feat].init)||0);

  /* equipment */
  C.weaponsPicked=[];
  if(S.gearMode==="kit"){
    const wo=DATA.simpleWeapons.map(w=>({v:w.n,l:w.n+" ("+w.d+" "+w.t+")"}));
    const wv=slot("weapons","equip","Choose two simple weapons (T p.10)",wo,2,"");
    C.weaponsPicked=wv.slice();
    if(wv.length<2) need(5,"Choose your two simple weapons.");
    if(!S.armor||!DATA.kitArmor.includes(S.armor)) need(5,"Choose studded leather or scale mail.");
  } else {
    if(S.gold==null) need(5,"Roll (or enter) your starting gold.");
  }
  C.armorKey = S.gearMode==="kit"?(DATA.kitArmor.includes(S.armor)?S.armor:"none"):S.goldArmor;
  C.shield = S.gearMode==="gold"&&S.goldShield;
  const A=DATA.armor[C.armorKey]||DATA.armor.none;
  let dexPart = A.cap===null?C.mod.dex:Math.min(C.mod.dex,A.cap);
  C.ac=A.base+dexPart+(C.shield?DATA.shield.bonus:0);
  C.acText=A.n+" ("+A.base+(A.cap===null?" + Dex":(" + Dex, max +"+A.cap))+")"+(C.shield?" + shield 2":"");
  C.stealthDis=A.stealth;
  if(S.gearMode==="gold" && S.gold!=null){
    const spent=A.cost+(C.shield?DATA.shield.cost:0); C.goldLeft=S.gold-spent;
    if(C.goldLeft<0) need(5,"Your armor costs more gold than you have.");
  }

  /* spells and infusions */
  const co=DATA.cantrips.map(c=>({v:c[0],l:c[0],src:c[1]}));
  const cv=slot("cantrips","spells","Artificer cantrips: choose "+C.cantripN,co,C.cantripN,"");
  if(cv.length<C.cantripN) need(6,"Choose "+C.cantripN+" cantrips.");
  if(R&&R.wizardCantrip){ const v=slot("cantrip:race","spells","High Elf: one wizard cantrip (Intelligence)",DATA.wizardCantrips.map(x=>({v:x,l:x,dis:cv.includes(x)})),1,""); if(!v[0]) need(6,"Choose your High Elf wizard cantrip."); }
  const po=DATA.spells1.map(c=>({v:c[0],l:c[0],src:c[1]}));
  const pv=slot("prepared","spells","Prepared 1st-level spells: choose "+C.prepN,po,C.prepN,"");
  if(pv.length<C.prepN) need(6,"Prepare "+C.prepN+" spell(s).");
  const io=DATA.infusions.filter(i=>i.lv<=Math.max(L,3)).map(i=>({v:i.n,l:i.n}));
  const iv=slot("infusions","spells","Infusions known: choose "+Math.max(C.inf.known,4)+" (you learn them at level 2)",io,4,"");
  if(L>=2 && iv.length<4) need(6,"Choose your 4 infusions.");
  C.cantrips=cv; C.prepared=pv; C.infusions=iv;
  /* active infusions (items infused today): up to C.inf.items, chosen from the known infusions (T p.12) */
  const av=slot("active","spells","Active infusions today: choose up to "+C.inf.items+" of your known infusions",iv.map(n=>({v:n,l:n})),C.inf.items,"");
  C.active=L>=2?av:[];
  C.edActive=false;
  if(C.active.indexOf("Enhanced Defense")>=0){
    if(C.armorKey!=="none"||C.shield){ C.edActive=true; C.ac+=1; C.acText+=" + Enhanced Defense 1"; }
    else C.notes.push("Enhanced Defense goes on armor or a shield, and you have neither, so it does not change your Armor Class.");
  }
  C.bonusSpells = (L>=3&&SP)?SP.spells[3]:[];
  if(!S.name.trim()) C.notes.push("You have not given your character a name yet (step 1).");
  C.blocking=C.problems.length>0;
  return C;
}

/* ---------- UI helpers ---------- */
function opt(selected,html,attrs,dis){ return '<label class="opt'+(selected?' sel':'')+(dis?' dis':'')+'" '+(attrs||'')+'>'+html+'</label>'; }
function srcPill(s){ return s==="X"?'<span class="pill x">Xanathar\'s</span>':s==="T"?'<span class="pill">Tasha\'s</span>':''; }
function renderSlot(C,s,opt2){
  opt2=opt2||{};
  if(s.count===1){
    let h='<label>'+esc(s.label)+'</label><select data-sel="'+esc(s.id)+'"><option value="">- choose -</option>';
    s.options.forEach(o=>{ h+='<option value="'+esc(o.v)+'"'+(s.value[0]===o.v?' selected':'')+(o.dis?' disabled':'')+'>'+esc(o.l)+(o.dis?' (already have)':'')+'</option>'; });
    return h+'</select>'+(s.hint?'<div class="hint">'+esc(s.hint)+'</div>':'');
  }
  let h='<label>'+esc(s.label)+' <span class="pill">'+s.value.length+' of '+s.count+'</span></label>';
  s.options.forEach(o=>{
    const on=s.value.includes(o.v), full=s.value.length>=s.count;
    h+='<label class="chk'+((o.dis||(!on&&full))?' dis':'')+'"><input type="checkbox" data-chk="'+esc(s.id)+'" value="'+esc(o.v)+'"'+(on?' checked':'')+((o.dis||(!on&&full))?' disabled':'')+'><span class="t">'+esc(o.l)+(o.dis?' (already have)':'')+'</span></label>';
  });
  return h;
}
function slotsFor(C,group,filter){ return C.slots.filter(s=>s.group===group&&(!filter||filter(s))).map(s=>renderSlot(C,s)).join(""); }

/* ---------- steps ---------- */
const STEP_FN=[];
STEP_FN[0]=function(C){
  return '<div class="card"><h2>1. Concept and name</h2><p class="hint">An artificer is an inventor-spellcaster. You use tools to cast spells and turn plain items into magic items (T p.9, T p.11-13).</p>'+
  '<label for="f-name">Character name</label><input type="text" id="f-name" data-text="name" value="'+esc(S.name)+'" placeholder="Your pirate&#39;s name">'+
  '<label for="f-concept">Concept: who are they, in one or two sentences?</label><textarea id="f-concept" data-text="concept" placeholder="A cheerful gnome who fixes things and loves gadgets.">'+esc(S.concept)+'</textarea>'+
  '<label for="f-align">Alignment (optional)</label><input type="text" id="f-align" data-text="align" value="'+esc(S.align)+'" placeholder="For example: Neutral good (PHB p.122)">'+
  '<p class="hint">Alignment is a short label for how your character thinks about right and wrong. It does not change any numbers.</p></div>'+
  '<div class="note"><b>Quick Build tip (T p.10):</b> put your highest score in Intelligence, then Constitution or Dexterity, and choose the Guild Artisan background.</div>'+
  '<div class="note">This tool builds a level 3 artificer. You start at level 1, gain Infuse Item at level 2, and pick your specialist at level 3 (T p.10, p.12-13). The sheet at the end explains what you had at each level.</div>';
};
STEP_FN[1]=function(C){
  let h='<div class="card"><h2>2. Race</h2><p class="hint">Your race gives ability score bonuses, speed, senses and other traits. Pick one from the Player\'s Handbook (PHB p.17-43) or build a Custom Lineage from Tasha\'s (T p.8).</p>';
  Object.keys(DATA.races).forEach(k=>{ const r=DATA.races[k]; h+=opt(S.race===k,'<input type="radio" name="race" data-race="'+k+'"'+(S.race===k?' checked':'')+'><b>'+esc(r.name)+'</b> <span class="pill">'+esc(r.page)+'</span><small>'+esc(r.blurb)+'</small>'); });
  h+='</div>';
  const R=C.R;
  if(R){

    h+='<div class="card"><h3>'+esc(b.name)+'</h3>';
    if(b.subraces){ h+='<label>Subrace (a variation of the race)</label>'; Object.keys(b.subraces).forEach(k=>{ const s=b.subraces[k]; h+=opt(S.subrace===k,'<input type="radio" name="sub" data-sub="'+k+'"'+(S.subrace===k?' checked':'')+'><b>'+esc(s.name)+'</b> <span class="pill">'+esc(s.page)+'</span><small>'+esc(s.blurb||"")+'</small>'); }); }
    if(S.race==="custom"){ h+='<label>Size</label><select data-set="lineSize"><option'+(S.lineSize==="Medium"?' selected':'')+'>Medium</option><option'+(S.lineSize==="Small"?' selected':'')+'>Small</option></select>';
      h+='<label>Variable trait (T p.8)</label><select data-set="customTrait"><option value="">- choose -</option><option value="dark"'+(S.customTrait==="dark"?' selected':'')+'>Darkvision 60 ft.</option><option value="skill"'+(S.customTrait==="skill"?' selected':'')+'>One skill of your choice</option></select>'; }
    if(R.dragon){ h+='<label>Draconic ancestry (PHB p.34)</label><select data-set="dragon"><option value="">- choose -</option>'+DATA.dragons.map(d=>'<option value="'+d[0]+'"'+(S.dragon===d[0]?' selected':'')+'>'+d[0]+' dragon: '+d[1]+', '+d[2]+'</option>').join("")+'</select>'; }
    if(!R.needSub || S.subrace){
      h+='<h3>Traits</h3><ul>'+R.traits.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ul><p class="hint">Size: '+esc(S.race==="custom"?S.lineSize:R.size)+'. Speed: '+R.speed+' ft. ('+esc(R.page)+')</p>';
      if(R.customOk) h+='<div class="note"><label style="display:flex;gap:8px;margin:0"><input type="checkbox" data-bool="customize"'+(S.customize?' checked':'')+'> Use Tasha\'s "Customizing Your Origin" (T p.7)</label><div class="hint">'+esc(DATA.customizeNotes)+'</div></div>';
      else if(R.key==="human"||R.key==="custom") h+='<div class="hint">Tasha\'s Customizing Your Origin has nothing to move for this choice: its increases are already your own to place or equal.</div>';
      const sl=asiSlots(R);

    h+='<tr><td>'+esc(w.n)+(rs?' (Repeating Shot)':'')+' <small>'+esc(props)+'</small></td><td>'+sg(C.mod[ab]+C.pb+rs)+'</td><td>'+w.d+sg(C.mod[ab]+rs)+' '+w.t+'</td></tr>'; });
  if(!wl.length) h+='<tr><td colspan="3">Add your bought weapons in step 6 notes. Simple weapon attack = ability modifier + '+sg(C.pb)+'.</td></tr>';
  h+='</table>';
  { const ex=[]; const inf=C.infusions||[]; const has=n=>wl.indexOf(n)>=0;
    if(has("Spear")){ ex.push('Spear, two hands (versatile): '+sg(C.mod.str+C.pb)+', 1d8'+sg(C.mod.str)+' piercing. One hand: '+sg(C.mod.str+C.pb)+', 1d6'+sg(C.mod.str)+'.'+(inf.indexOf("Enhanced Weapon")>=0?' With Enhanced Weapon on it: '+sg(C.mod.str+C.pb+1)+', one hand 1d6'+sg(C.mod.str+1)+', two hands 1d8'+sg(C.mod.str+1)+'.':'')); }
    if(C.cantrips.indexOf("Shocking grasp")>=0) ex.push('Shocking Grasp (cantrip, touch): '+sg(C.atk)+', 1d8 lightning. On a hit, the target cannot take reactions until the start of its next turn. Advantage on the attack if the target wears metal armor (PHB p.275).');
    if(inf.indexOf("Repeating Shot")>=0&&S.gearMode==="kit"){
      if(rsOn) ex.push('Light crossbow without Repeating Shot: '+sg(C.mod.dex+C.pb)+', 1d8'+sg(C.mod.dex)+' piercing, and it has the loading property again.');
      else ex.push('Light crossbow with Repeating Shot (when it is one of your active infusions; needs attunement): '+sg(C.mod.dex+C.pb+1)+', 1d8'+sg(C.mod.dex+1)+' piercing. No loading needed; it makes its own ammunition.');
    }
    if(ex.length) h+='<ul>'+ex.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    if(C.edActive) h+='<p class="hint">Your Armor Class includes +1 from Enhanced Defense. Without it: '+(C.ac-1)+'.</p>';
    else if(inf.indexOf("Enhanced Defense")>=0&&(C.armorKey!=="none"||C.shield)) h+='<p class="hint">Armor Class with Enhanced Defense active on your armor: '+(C.ac+1)+'.</p>';
    if(S.activeNote) h+='<p><b>'+esc(S.activeNote)+'</b></p>';
    if(L>=3&&S.specialist==="artillerist") h+='<h3>Eldritch Cannon (T p.17-18)</h3><ul><li>Make it: an action, with woodcarver\'s or smith\'s tools in hand. It appears in an empty space on the ground within 5 ft (Small or Tiny). Free once per long rest; after that, spend a spell slot. Only one cannon at a time.</li><li>Armor Class 18, '+(5*L)+' hit points. Immune to poison and psychic damage. Mending heals it 2d6. It lasts 1 hour, or until it drops to 0 hit points or you dismiss it (an action).</li><li>Use it: a bonus action on your turn while you are within 60 ft of it. The same bonus action can make it walk or climb 15 ft if it has legs. If you do not activate it, it does nothing.</li><li>Force Ballista: ranged spell attack '+sg(C.atk)+' at a target within 120 ft, 2d8 force damage, pushes a creature 5 ft.</li><li>Flamethrower: 15-ft cone, Dexterity save DC '+C.dc+', 2d8 fire on a fail, half on a success.</li><li>Protector: 1d8'+sg(Math.max(1,C.intMod))+' temporary hit points to itself and each creature you choose within 10 ft of it.</li></ul><p class="hint">Looks like a small ship&#39;s cannon (you choose its look, T p.17-18).</p>';
  }
  if(L>=3&&S.specialist==="battlesmith") h+='<p class="hint">Battle Smith: with a magic weapon you may use Intelligence ('+sg(C.mod.int)+') instead of Strength or Dexterity for attack and damage (T p.19).</p>';
  h+='<div class="sh-cols"><div><h3>Proficiencies</h3><p><b>Armor:</b> '+DATA.cls.armor+(L>=3&&S.specialist==="armorer"?', heavy armor':'')+'.</p><p><b>Weapons:</b> '+DATA.cls.weapons+(L>=3&&S.specialist==="battlesmith"?', martial weapons':'')+'.</p><p><b>Tools:</b> '+Array.from(C.owned.tools).join(", ")+'.</p><p><b>Languages:</b> '+languagesFinal(C).join(", ")+'.</p>'+(S.profNote?'<p><b>Swap note:</b> '+esc(S.profNote)+'</p>':'')+'</div>';
  h+='<div><h3>Equipment</h3>'+(S.gearMode==="kit"?'<ul><li>'+esc(DATA.armor[C.armorKey].n)+'</li>'+C.weaponsPicked.map(w=>'<li>'+esc(w)+'</li>').join("")+DATA.kitFixed.map(x=>'<li>'+esc(x.split(" (")[0])+'</li>').join("")+'</ul>'+(BG?'<p class="hint">Background gear: '+esc(BG.equip)+'</p>':'')+(S.otherGear?'<p>'+esc(S.otherGear)+'</p>':''):'<p>Gold bought: '+(S.gold==null?'-':S.gold)+' gp. Armor: '+esc(DATA.armor[C.armorKey].n)+(C.shield?', shield':'')+'. Gold left: '+(C.goldLeft==null?'-':C.goldLeft)+' gp.</p><p>'+esc(S.otherGear)+'</p>')+'</div></div>';
  h+='<h3>Features and traits</h3><ul>';
  DATA.cls.features.filter(f=>f[0]<=L).forEach(f=>h+='<li><b>'+esc(f[1])+'</b> (level '+f[0]+', '+f[3]+'): '+esc(f[2])+'</li>');
  if(L>=3&&P) P.features.filter(f=>f[0]<=3).forEach(f=>h+='<li><b>'+esc(f[1])+'</b> ('+esc(P.name)+', '+f[3]+'): '+esc(f[2])+'</li>');
  if(R) R.traits.forEach(t=>h+='<li>'+esc(t)+'</li>');
  if(R&&R.dragon&&S.dragon){ const d=DATA.dragons.find(x=>x[0]===S.dragon); h+='<li>Ancestry: '+d[0]+' dragon. Breath weapon: 2d6 '+d[1]+', '+d[2]+', save DC '+(8+C.mod.con+C.pb)+'. Resistance to '+d[1]+'.</li>'; }
  if(R&&R.key==="custom"&&S.customTrait==="dark") h+='<li>Darkvision 60 ft.</li>';
  if(C.feat) h+='<li><b>Feat: '+DATA.feats[C.feat].n+'</b> ('+DATA.featsPage+'): '+esc(DATA.feats[C.feat].t)+'</li>';
  if(BG) h+='<li><b>Background feature: '+esc(BG.feature)+'</b> ('+esc(BG.page)+')</li>';
  h+='</ul>';
  h+='<h3>Infusions'+(L<2?' (planned, from level 2)':'')+'</h3><p>'+(C.infusions.length?C.infusions.join(", "):'None chosen.')+'</p>'+(C.active.length?'<p><b>Active today:</b> '+esc(C.active.join(", "))+'</p>':'')+(L>=2?'<p class="hint">Known: '+C.inf.known+'. Items you can infuse at once: '+C.inf.items+' (T p.10).</p>':'');
  h+='<h3>How you got here</h3><ul><li><b>Level 1:</b> 8 + Con hit points, Magical Tinkering, Spellcasting with '+C.cantripN+' cantrips and 2 first-level slots (T p.10-12).</li><li><b>Level 2:</b> Infuse Item. You learned 4 infusions and can infuse 2 items at a time (T p.10, p.12-13). Hit points + '+(S.hpMode==="roll"?'your d8 roll':'5')+' + Con modifier. Still 2 first-level slots.</li><li><b>Level 3:</b> Specialist ('+esc(P?P.name:"-")+'), The Right Tool for the Job, always-prepared specialist spells, and a third first-level slot (T p.10, p.13). You can prepare '+C.prepN+' spells: your Int modifier plus half your level, rounded down (half of 2 or 3 is 1) (T p.11). Proficiency bonus stays +2 until level 5.</li></ul><p class="hint">Hit points: '+(S.hpMode==="roll"?'rolled':'fixed average of 5 per level')+' for levels 2 and 3. Ability Score Improvement comes at level 4 (T p.13).</p>';
  h+='<p class="hint">Made with the Artificer Character Creator. Rules: Tasha\'s Cauldron of Everything and Player\'s Handbook (2014). Check page numbers in your books.</p></div></div>';
  return h;
};
function languagesFinal(C){
  const R=C.R; const out=[];
  if(R) R.langs.forEach((lg,i)=>{ const sw=(S.sel["lang:swap:"+i]||""); out.push(sw||lg); });
  ["lang:race","lang:bg"].forEach(id=>{ const v=S.sel[id]; if(Array.isArray(v)) v.forEach(x=>out.push(x)); else if(v) out.push(v); });
  return out.length?out:["-"];
}

/* ---------- main render ---------- */
function render(){
  const C=compute(); save();
  const stepsEl=document.getElementById("steps");
  stepsEl.innerHTML=STEPS.map((n,i)=>'<button data-step="'+i+'" class="'+(i===S.step?'cur ':'')+(C.problems.some(p=>p.step===i)&&i<8?'bad':'')+'" title="'+esc(n)+'">'+(i+1)+'<span class="lbl"> '+esc(n)+'</span></button>').join("");
  document.getElementById("levelbar").innerHTML=''; void '<b>Show sheet at:</b> <button class="btn sec'+(S.level===1?' cur':'')+'" data-level="1">Level 1</button><button class="btn sec'+(S.level===3?' cur':'')+'" data-level="3">Level 3 (with specialist)</button><span class="hint" style="margin:0">Level 3 adds your specialist, infusions, and more spell slots (T p.10, p.13).</span>';
  document.getElementById("app").innerHTML=STEP_FN[S.step](C);
  document.getElementById("navbtns").innerHTML='<button class="btn sec" data-nav="-1"'+(S.step===0?' disabled':'')+'>&larr; Back</button><button class="btn sec" data-act="reset">Start over</button><button class="btn" data-nav="1"'+(S.step===8?' disabled':'')+'>Next &rarr;</button>';
  window.CREATOR={S:S,C:C,DATA:DATA,compute:compute};
}
function clearRaceSel(){ Object.keys(S.sel).filter(k=>/^(lang:swap|skill:swap|skill:dup|skill:race|lang:race|tool:race|tool:dup|tool:racedup|feat:|cantrip:race)/.test(k)).forEach(k=>delete S.sel[k]); }
function resetRacePicks(){ S.flexPick=[]; S.custPick=[]; clearRaceSel(); S.customTrait=""; S.dragon=""; }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-step],[data-nav],[data-act],[data-goto],[data-level]"); if(!t) return;
  if(t.hasAttribute("data-step")){ S.step=+t.dataset.step; render(); window.scrollTo(0,0); }
  else if(t.hasAttribute("data-nav")){ S.step=Math.max(0,Math.min(8,S.step+ +t.dataset.nav)); render(); window.scrollTo(0,0); }
  else if(t.hasAttribute("data-goto")){ e.preventDefault(); S.step=+t.dataset.goto; render(); window.scrollTo(0,0); }
  else if(t.hasAttribute("data-level")){ S.level=+t.dataset.level; render(); }
  else if(t.dataset.act==="print"){ window.print(); }
  else if(t.dataset.act==="preset"){ if(confirm("Replace your current choices with the pirate build? Your current choices will be lost.")){ loadPreset(); render(); window.scrollTo(0,0); } }
  else if(t.dataset.act==="reset"){ if(confirm("Start over? This clears everything you chose.")){ S=defaults(); render(); } }
  else if(t.dataset.act==="suggest"){ if(S.method==="standard") ABIL.forEach(a=>S.std[a]=DATA.suggested.standard[a]); else { const v=DATA.standardArray.slice(); ABIL.forEach(a=>S.man[a]=DATA.suggested.standard[a]); } render(); }
  else if(t.dataset.act==="roll"){ ABIL.forEach(a=>{ const d=[0,0,0,0].map(()=>{let r; do{ r=1+Math.floor(Math.random()*6); }while(r===1); return r;}).sort((x,y)=>x-y); S.man[a]=d[1]+d[2]+d[3]; }); render(); }
  else if(t.dataset.act==="rollhp"){ S.hpRolls=[0,0].map(()=>{let r; do{ r=1+Math.floor(Math.random()*8); }while(r===1); return r;}); render(); }
  else if(t.dataset.act==="rollgold"){ let s=0; for(let i=0;i<DATA.goldDice.n;i++) s+=1+Math.floor(Math.random()*DATA.goldDice.sides); S.gold=s*DATA.goldDice.mult; render(); }
});
document.addEventListener("change",e=>{
  const t=e.target; const d=t.dataset; let r=true;
  if(d.race!==undefined){ if(S.race!==d.race){ S.race=d.race; S.subrace=""; S.customize=false; resetRacePicks(); } }
  else if(d.sub!==undefined){ S.subrace=d.sub; S.flexPick=[]; S.custPick=[]; clearRaceSel(); }
  else if(d.bool!==undefined){ S[d.bool]=t.checked; if(d.bool==="customize"){ S.flexPick=[]; S.custPick=[]; clearRaceSel(); } }
  else if(d.set!==undefined){ S[d.set]=t.value; if(d.set==="customTrait") clearRaceSel(); }
  else if(d.asi!==undefined){ const R=effRace(); const arr=asiPicks(R); arr[+d.asi]=t.value; }
  else if(d.method!==undefined){ S.method=d.method==='pointbuy'?'standard':d.method; }
  else if(d.std!==undefined){ S.std[d.std]=t.value===""?null:+t.value; }
  else if(d.man!==undefined){ S.man[d.man]=t.value===""?null:Number(t.value); }
  else if(d.bg!==undefined){ if(S.bg!==d.bg){ S.bg=d.bg; ["lang:bg"].forEach(k=>delete S.sel[k]); Object.keys(S.sel).filter(k=>k.indexOf("tool:bg")===0||k==="skill:bgchoice").forEach(k=>delete S.sel[k]); } }
  else if(d.hpm!==undefined){ S.hpMode=d.hpm; }
  else if(d.hpr!==undefined){ S.hpRolls[+d.hpr]=t.value===""?null:Number(t.value); }
  else if(d.gear!==undefined){ S.gearMode=d.gear; }
  else if(d.armor!==undefined){ S.armor=d.armor; }
  else if(d.gold!==undefined){ const v=t.value===""?null:Number(t.value); S.gold=(v==null||isNaN(v))?null:Math.max(0,v); }
  else if(d.spec!==undefined){ S.specialist=d.spec; delete S.sel["tool:spec"]; }
  else if(d.sel!==undefined){ S.sel[d.sel]=t.value; }
  else if(d.chk!==undefined){ let arr=Array.isArray(S.sel[d.chk])?S.sel[d.chk].slice():[]; if(t.checked){ if(!arr.includes(t.value)) arr.push(t.value);} else arr=arr.filter(x=>x!==t.value); S.sel[d.chk]=arr; }
  else r=false;
  if(r) render();
});
document.addEventListener("input",e=>{ const t=e.target; if(t.dataset.text!==undefined){ S[t.dataset.text]=t.value; save(); } });
load(); render();
</script>
