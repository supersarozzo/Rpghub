<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" role="img" aria-label="Skippy, a half-orc artificer, on a beach at sunset with his small brass cannon Mourning Bell">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22334f"/>
      <stop offset="0.38" stop-color="#7c3f4e"/>
      <stop offset="0.66" stop-color="#d9784c"/>
      <stop offset="0.9" stop-color="#f4bb72"/>
      <stop offset="1" stop-color="#f8d395"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="400" cy="470" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0c2" stop-opacity="0.95"/>
