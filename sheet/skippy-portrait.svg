    <linearGradient id="brassv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d47a"/>
      <stop offset="0.5" stop-color="#cf9631"/>
      <stop offset="1" stop-color="#83561c"/>
