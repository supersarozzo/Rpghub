    <radialGradient id="arcane" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#9ff3e2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5fd6c4" stop-opacity="0"/>
