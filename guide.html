<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px;scroll-behavior:auto;overflow-anchor:none}

a.btn.big{padding:12px 20px;font-size:1.05rem;font-weight:700}
button.btn.sec,a.btn.sec{background:#fff;color:var(--accent)}
button.btn.on{background:var(--accent);color:#fff}
nav.toc{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
nav.toc a{flex:0 0 auto;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:14px;color:var(--ink);text-decoration:none;font-size:.88rem}
nav.toc a.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:12px 16px 60px}
section.sec{margin:0 0 22px}
section.sec>h2{margin:18px 0 6px;font-size:1.45rem;border-bottom:2px solid var(--ink);padding-bottom:4px}
h3{margin:16px 0 4px;font-size:1.1rem}
h4{margin:10px 0 2px;font-size:1rem}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 10px}
.card h3,.card h4{margin-top:0}
.hint{color:var(--muted);font-size:.93rem}
.note{background:#eef3f2;border-left:4px solid var(--accent);padding:8px 10px;margin:8px 0;font-size:.95rem}
.warn{background:var(--warn-bg);border-left:4px solid var(--warn);padding:8px 10px;margin:8px 0;font-size:.95rem;color:var(--warn)}
.ok{background:var(--ok-bg);border-left:4px solid var(--ok);padding:8px 10px;margin:8px 0;font-size:.95rem;color:var(--ok)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:.8rem;color:var(--muted);margin:0 2px}
.pill.x{border-color:var(--warn);color:var(--warn)}
.pill.star{border-color:var(--ok);color:var(--ok);font-weight:700}
.pill.l3{background:var(--hi);border-color:#c9b300;color:#554a00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.grid .card{margin:0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top;background:#fff}
th{background:#f0efe9}
.tw{overflow-x:auto;max-width:100%}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tl{border-left:3px solid var(--line);margin:8px 0 8px 6px;padding-left:12px}
.tl .it{margin:0 0 8px;position:relative}
.tl .it::before{content:"";position:absolute;left:-18px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--line)}
.tl .it.mine{background:var(--hi);border-radius:6px;padding:4px 8px}
.tl .it.mine::before{background:var(--accent)}
.lv{font-weight:700}
.term{border-bottom:1px dotted var(--accent);cursor:help}
#tip{position:fixed;z-index:50;max-width:280px;background:#1d1d1b;color:#fff;padding:7px 10px;border-radius:6px;font-size:.88rem;display:none;pointer-events:none}
#results{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:8px;max-height:50vh;overflow-y:auto}
#results div{padding:7px 10px;border-bottom:1px solid #eee;cursor:pointer}
#results div:hover{background:#f0f6f5}
#results small{display:block;color:var(--muted)}
.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{background:var(--hi)}100%{background:transparent}}
.q{margin:0 0 10px}
.q label{display:block;border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin:5px 0;background:#fff;cursor:pointer}
.q input{margin-right:8px}
details{margin:6px 0}
summary{cursor:pointer;font-weight:600}
@media(max-width:600px){.card table{display:block;overflow-x:auto;max-width:100%}}

function gl(text){ // escape + wrap first use of each glossary term in this section
  let s=esc(text); const toks=[];

}

  h+='<div class="ok"><b>Verdict:</b> the artificer fits your table. Nothing is against the rules or banned. Only a few things need a quick talk with the DM.</div>';
  h+='<h3>Question 7: Xanathar\'s spells</h3>'+P("Yes, the Xanathar's spells on the Tasha's artificer list can be used by an artificer, and \"anything official\" allows them. You need the spell text, which is not in your two books. The DM can read it to you, or you can borrow or buy Xanathar's Guide. At level 3 you only need cantrips and 1st-level spells. My view: skip them for your first character.");
  h+='<div class="tw"><table><tr><th>Table rule</th><th>What it means for an artificer</th><th>Problem?</th></tr>'+G.table.map(r=>'<tr data-s><td>'+esc(r[0])+'</td><td>'+gl(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join("")+'</table></div>';
  h+='<h3>Is the artificer broken at level 3? (honest)</h3>'+P("Almost certainly no. Spells are only 1st level and you have three slots. Infusions give small bonuses like +1 weapon or +1 armor (T p.21). The Steel Defender and the Eldritch Cannon are normal official features. The strong item features start at level 10 (T p.13-14).");
  h+='<h3>Ask your DM</h3><ol>'+G.askDm.map(q=>'<li data-s>'+esc(q)+'</li>').join("")+'</ol>';
  h+='<p class="hint">Sources for facts about books you do not own: web pages about the Faction Agent background (a fan website) and the Gunslinger subclass (dungeonmister.com, D&amp;D Beyond forums). They are not rules. Check them with your DM.</p>';
  return sec("table","Your table's rules and the artificer",h);
}
/* ---------- 10. glossary ---------- */
function secGloss(){
  used=new Set();
  const keys=Object.keys(G.glossary).sort();
  const h='<div class="grid">'+keys.map(k=>'<div class="card" id="g-'+esc(k.replace(/\W+/g,"-"))+'" data-s><h4>'+esc(k)+'</h4><p>'+esc(G.glossary[k])+'</p></div>').join("")+'</div><p class="hint">In the text above, the first use of each term in a section is underlined with dots. Hover or tap it to see its meaning.</p>';
  return sec("gloss","Glossary",h);
}

/* ---------- build ---------- */
function build(){
  document.getElementById("main").innerHTML=[secWhat(),secNumbers(),secCasting(),secFeatures(),secInfusions(),secPaths(),secSkills(),secSpells(),secTable(),secGloss()].join("");
  document.getElementById("toc").innerHTML=SECS.map(s=>'<a href="#'+s[0]+'" data-toc="'+s[0]+'">'+esc(s[1])+'</a>').join("");
  buildIndex();
}
function buildIndex(){
  IDX.length=0;
  document.querySelectorAll("section.sec").forEach(sc=>{
    const title=sc.querySelector("h2").textContent; const id=sc.id;
    addIdx(sc.querySelector("h2"),title,title,()=>{});
    sc.querySelectorAll("h3,h4,[data-s]").forEach(el=>{ if(el.closest("#results")) return; addIdx(el,(el.tagName[0]==="H"?el.textContent:(el.querySelector("b,h4")||el).textContent.slice(0,60)),title,()=>{}); });
  });
  // dynamic content: infusions and spells (all, even if filtered out)
  G.infusions.forEach(i=>IDX.push({el:null,title:i.n+" (infusion)",sec:"Infusions",text:(i.n+" "+i.item+" "+i.line).replace(/\s+/g," "),go:()=>{infFilter="all";refreshInf();flash('[data-inf="'+i.n+'"]');}}));
  G.spells.forEach(s=>IDX.push({el:null,title:s[0]+" (spell)",sec:"Spells",text:(s[0]+" "+s[8]+" "+s[4]+" "+s[5]).replace(/\s+/g," "),go:()=>{spLevel="all";spBook="all";spBeg=false;refreshSp();flash('[data-spell="'+s[0]+'"]');}}));
  G.high.forEach(s=>IDX.push({el:null,title:s[1]+" (spell, level "+s[0]+")",sec:"Spells",text:(s[1]+" "+s[3]),go:()=>{spLevel="all";spBook="all";spBeg=false;refreshSp();flash('[data-spell="'+s[1]+'"]');}}));
  Object.keys(SP).forEach(k=>SP[k].features.forEach(f=>IDX.push({el:null,title:f[1]+" ("+SP[k].name+")",sec:"Paths",text:(f[1]+" "+f[2]+" "+SP[k].name),go:()=>{specKey=k;refreshSpec();flash("#spec-view");document.getElementById("spec-tabs").scrollIntoView({block:"center"});}})));
}
function flash(sel){ const el=document.querySelector(sel); if(!el) return; el.scrollIntoView({block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
function refreshInf(){ document.getElementById("inf-list").innerHTML=infList(); document.querySelectorAll("[data-inff]").forEach(b=>b.classList.toggle("on",b.dataset.inff===infFilter)); }
function refreshSp(){ document.getElementById("spell-list").innerHTML=spellList(); document.querySelectorAll("[data-splv]").forEach(b=>b.classList.toggle("on",b.dataset.splv===spLevel)); document.querySelectorAll("[data-spbk]").forEach(b=>b.classList.toggle("on",b.dataset.spbk===spBook)); document.getElementById("f-beg").classList.toggle("on",spBeg); }
function refreshSpec(){ document.getElementById("spec-view").innerHTML=specView(specKey); document.querySelectorAll("[data-spec]").forEach(b=>b.classList.toggle("on",b.dataset.spec===specKey)); }

/* ---------- search ---------- */
function search(q){
  const box=document.getElementById("results"); q=q.trim().toLowerCase();
  if(q.length<2){ box.style.display="none"; box.innerHTML=""; return; }
  const words=q.split(/\s+/); const seen=new Set(); const out=[];
  IDX.forEach(it=>{ const t=(it.title+" "+it.text).toLowerCase(); if(words.every(w=>t.includes(w))){ const key=it.title+"|"+it.sec; if(seen.has(key)) return; seen.add(key); out.push(it); } });
  box.style.display="block";
  window.__results=out.slice(0,40);
  box.innerHTML=out.length?out.slice(0,40).map((it,i)=>{ const p=it.text.toLowerCase().indexOf(words[0]); const sn=it.text.slice(Math.max(0,p-30),p+80); return '<div data-res="'+i+'"><b>'+esc(it.title.slice(0,70))+'</b> <span class="pill">'+esc(it.sec)+'</span><small>...'+esc(sn)+'...</small></div>'; }).join("")+(out.length>40?'<div><small>More than 40 results. Type more letters.</small></div>':''):'<div>No results.</div>';
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const res=t.closest("[data-res]");
  if(res){ const it=window.__results[+res.dataset.res]; document.getElementById("results").style.display="none"; if(it.el){ it.el.scrollIntoView({block:"center"}); it.el.classList.remove("flash"); void it.el.offsetWidth; it.el.classList.add("flash"); } else it.go(); return; }
  let b;
  if(b=t.closest("[data-inff]")){ infFilter=b.dataset.inff; refreshInf(); }
  else if(b=t.closest("[data-splv]")){ spLevel=b.dataset.splv; refreshSp(); }
  else if(b=t.closest("[data-spbk]")){ spBook=b.dataset.spbk; refreshSp(); }
  else if(b=t.closest("[data-spbeg]")){ spBeg=!spBeg; refreshSp(); }
  else if(b=t.closest("[data-spec]")){ specKey=b.dataset.spec; refreshSpec(); }
  else if(t.id==="quizgo"){ quiz(); }
  else if(b=t.closest("[data-term]")){ showTip(b); }
  else if(!t.closest("#results")&&!t.closest("#q")){ document.getElementById("results").style.display="none"; hideTip(); }
});
document.addEventListener("input",e=>{ if(e.target.id==="q") search(e.target.value); });
function quiz(){
  const score={alchemist:0,armorer:0,artillerist:0,battlesmith:0}; let n=0;
  G.quiz.forEach((q,i)=>{ const c=document.querySelector('input[name="q'+i+'"]:checked'); if(c){ n++; Object.entries(q.a[+c.value][1]).forEach(([k,v])=>score[k]+=v); } });
  const out=document.getElementById("quizout");
  if(n<G.quiz.length){ out.innerHTML='<div class="warn">Please answer all '+G.quiz.length+' questions ('+n+' answered).</div>'; return; }
  const max=Math.max(...Object.values(score)); const top=Object.keys(score).filter(k=>score[k]===max);
  out.innerHTML='<div class="ok"><b>Suggestion: '+top.map(k=>esc(SPNAMES[k])).join(" or ")+'.</b> '+top.map(k=>esc(SP[k].feel)).join(" ")+' <button class="btn sec" data-spec="'+top[0]+'" style="margin-top:6px">Show '+esc(SPNAMES[top[0]])+' details</button></div><p class="hint">Scores: '+Object.keys(score).map(k=>SPNAMES[k]+" "+score[k]).join(", ")+'. This is only a suggestion; you decide.</p>';
}
/* tooltips */
const tip=document.getElementById("tip");
function showTip(el){ tip.textContent=G.glossary[el.dataset.term]||""; tip.style.display="block"; const r=el.getBoundingClientRect(); let x=Math.min(Math.max(8,r.left),window.innerWidth-tip.offsetWidth-8); let y=r.bottom+6; if(y+tip.offsetHeight>window.innerHeight-8) y=r.top-tip.offsetHeight-6; tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.style.display="none"; }
document.addEventListener("mouseover",e=>{ const t=e.target.closest&&e.target.closest("[data-term]"); if(t) showTip(t); });
document.addEventListener("mouseout",e=>{ if(e.target.closest&&e.target.closest("[data-term]")) hideTip(); });
document.addEventListener("focusin",e=>{ const t=e.target.closest&&e.target.closest("[data-term]"); if(t) showTip(t); });
document.addEventListener("focusout",hideTip);
/* toc highlight */
window.addEventListener("scroll",hideTip,{passive:true});
let tocTick=false;
window.addEventListener("scroll",()=>{ if(tocTick) return; tocTick=true; requestAnimationFrame(()=>{ tocTick=false; let cur=SECS[0][0]; SECS.forEach(s=>{ const el=document.getElementById(s[0]); if(el&&el.getBoundingClientRect().top<140) cur=s[0]; }); document.querySelectorAll("[data-toc]").forEach(a=>a.classList.toggle("cur",a.dataset.toc===cur)); }); },{passive:true});
build();
</script>
</body>
</html>
